<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Run - Tela Cheia</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            background-color: #f7f7f7;
            /* Deixa a tela cheia mantendo proporção ou ocupando o espaço ideal */
            width: 100vw;
            height: 100vh;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Configura a resolução interna fixa para manter o pixel art proporcional na tela cheia
        const internalWidth = 900;
        const internalHeight = 400;
        canvas.width = internalWidth;
        canvas.height = internalHeight;

        ctx.imageSmoothingEnabled = false;

        // Web Audio API para os efeitos sonoros
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        // Som de Miado (para o pulo)
        function playMeowSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                let now = audioCtx.currentTime;

                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(350, now + 0.3);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.3);
            } catch(e) {}
        }

        // Som a cada 100 pontos
        function playScoreSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                let now = audioCtx.currentTime;

                osc.type = 'square';
                osc.frequency.setValueAtTime(587.33, now); 
                osc.frequency.setValueAtTime(880, now + 0.08); 

                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.2);
            } catch(e) {}
        }

        // Variáveis do Jogo
        let score = 0;
        let highScore = 0;
        let gameSpeed = 6;
        let isGameOver = false;
        let gameStarted = false;

        // Chão ajustado para a nova altura interna
        const groundY = 310;

        // Gato Cinza (Player) melhorado
        const cat = {
            x: 80,
            y: groundY - 45,
            width: 46,
            height: 34,
            dy: 0,
            jumpPower: -11.5,
            gravity: 0.6,
            grounded: true,
            animTimer: 0,
            legState: 0
        };

        let obstacles = [];
        let clouds = [
            { x: 200, y: 80, speed: 1 },
            { x: 600, y: 120, speed: 1.3 },
            { x: 850, y: 70, speed: 0.8 }
        ];

        let obstacleTimer = 0;
        let nextObstacleInterval = 100;
        let lastHundredMark = 0;

        // Controles (Suporta Espaço, Seta para cima e Toque na Tela)
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                triggerJump();
            }
        });

        window.addEventListener("touchstart", () => {
            triggerJump();
        });

        function triggerJump() {
            initAudio();
            if (isGameOver) {
                resetGame();
            } else if (!gameStarted) {
                gameStarted = true;
            } else if (cat.grounded) {
                cat.dy = cat.jumpPower;
                cat.grounded = false;
                playMeowSound();
            }
        }

        function resetGame() {
            score = 0;
            gameSpeed = 6;
            obstacles = [];
            isGameOver = false;
            obstacleTimer = 0;
            lastHundredMark = 0;
            cat.y = groundY - cat.height;
            cat.dy = 0;
            cat.grounded = true;
        }

        // Desenhar Gato Cinza Melhorado e Pixelizado
        function drawCat() {
            // Cores do Gato Cinza
            const mainGray = "#7f8c8d";
            const darkGray = "#595f61";
            const lightGray = "#bdc3c7";
            const pink = "#ffb6c1";

            // Corpo principal
            ctx.fillStyle = mainGray;
            ctx.fillRect(cat.x + 6, cat.y + 12, 32, 16);
            
            // Peito / Barriga
            ctx.fillStyle = lightGray;
            ctx.fillRect(cat.x + 10, cat.y + 16, 20, 10);

            // Cabeça
            ctx.fillStyle = mainGray;
            ctx.fillRect(cat.x + 26, cat.y + 2, 18, 16);

            // Orelhas (pontinhas)
            ctx.fillRect(cat.x + 28, cat.y - 4, 4, 6);
            ctx.fillRect(cat.x + 38, cat.y - 4, 4, 6);
            // Interior rosa das orelhas
            ctx.fillStyle = pink;
            ctx.fillRect(cat.x + 29, cat.y - 2, 2, 3);
            ctx.fillRect(cat.x + 39, cat.y - 2, 2, 3);

            // Focinho e Olho
            ctx.fillStyle = "#2c3e50";
            ctx.fillRect(cat.x + 39, cat.y + 6, 2, 2); // Olho
            ctx.fillStyle = pink;
            ctx.fillRect(cat.x + 42, cat.y + 9, 2, 2); // Narizinho

            // Bigodes
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(cat.x + 44, cat.y + 10, 4, 1);
            ctx.fillRect(cat.x + 44, cat.y + 12, 4, 1);

            // Cauda erguida e charmosa
            ctx.fillStyle = mainGray;
            ctx.fillRect(cat.x, cat.y + 4, 6, 12);
            ctx.fillRect(cat.x - 4, cat.y + 2, 5, 5);

            // Pernas com animação de corrida
            ctx.fillStyle = darkGray;
            if (cat.grounded && gameStarted && !isGameOver) {
                cat.animTimer++;
                if (cat.animTimer > 6) {
                    cat.legState = 1 - cat.legState;
                    cat.animTimer = 0;
                }
            }

            if (cat.legState === 0) {
                ctx.fillRect(cat.x + 10, cat.y + 28, 4, 6);
                ctx.fillRect(cat.x + 28, cat.y + 28, 4, 6);
            } else {
                ctx.fillRect(cat.x + 14, cat.y + 28, 4, 6);
                ctx.fillRect(cat.x + 24, cat.y + 28, 4, 6);
            }
        }

        // Desenhar Banheira com Água
        function drawBathtub(obs) {
            // Borda superior da banheira
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(obs.x - 2, obs.y + 4, obs.width + 4, 6);

            // Corpo da banheira
            ctx.fillStyle = "#d0d3d4";
            ctx.fillRect(obs.x, obs.y + 10, obs.width, obs.height - 10);
            
            // Sombra interna da banheira
            ctx.fillStyle = "#95a5a6";
            ctx.fillRect(obs.x + 2, obs.y + 10, 4, obs.height - 12);

            // Pezinhos da banheira
            ctx.fillStyle = "#34495e";
            ctx.fillRect(obs.x + 4, obs.y + obs.height, 6, 6);
            ctx.fillRect(obs.x + obs.width - 10, obs.y + obs.height, 6, 6);

            // Água dentro da banheira
            ctx.fillStyle = "#3498db";
            ctx.fillRect(obs.x + 4, obs.y + 14, obs.width - 8, obs.height - 18);
            
            // Brilho na água
            ctx.fillStyle = "#85c1e9";
            ctx.fillRect(obs.x + 8, obs.y + 16, 8, 4);
        }

        // Loop Principal do Jogo
        function update() {
            ctx.clearRect(0, 0, internalWidth, internalHeight);

            // Nuvens no Céu
            ctx.fillStyle = "#e5e8e8";
            clouds.forEach(cloud => {
                if (gameStarted && !isGameOver) {
                    cloud.x -= cloud.speed;
                    if (cloud.x < -70) {
                        cloud.x = internalWidth + 60;
                        cloud.y = Math.floor(Math.random() * 100) + 40;
                    }
                }
                ctx.fillRect(cloud.x, cloud.y, 50, 14);
                ctx.fillRect(cloud.x + 12, cloud.y - 8, 26, 10);
            });

            // Chão
            ctx.fillStyle = "#7f8c8d";
            ctx.fillRect(0, groundY, internalWidth, 4);
            // Detalhes do chão
            for (let i = 0; i < internalWidth; i += 40) {
                let offset = (i - (Date.now() / 15 * (gameStarted && !isGameOver ? gameSpeed : 0))) % internalWidth;
                if (offset < 0) offset += internalWidth;
                ctx.fillRect(offset, groundY + 6, 14, 2);
            }

            if (gameStarted && !isGameOver) {
                // Pontuação
                score += 0.12;
                let currentScoreInt = Math.floor(score);

                // Marco de 100 pontos
                if (currentScoreInt > 0 && currentScoreInt % 100 === 0 && currentScoreInt !== lastHundredMark) {
                    lastHundredMark = currentScoreInt;
                    playScoreSound();
                }

                // Dificuldade progressiva (velocidade aumenta)
                gameSpeed = 6 + Math.floor(score / 120) * 0.9;

                // Física do Gato
                cat.dy += cat.gravity;
                cat.y += cat.dy;

                if (cat.y >= groundY - cat.height) {
                    cat.y = groundY - cat.height;
                    cat.dy = 0;
                    cat.grounded = true;
                }

                // Gestão de Obstáculos (Banheiras)
                obstacleTimer++;
                if (obstacleTimer >= nextObstacleInterval) {
                    obstacles.push({
                        x: internalWidth,
                        y: groundY - 36,
                        width: 40,
                        height: 36
                    });
                    obstacleTimer = 0;
                    nextObstacleInterval = Math.floor(Math.random() * 55) + 65 - Math.min(gameSpeed * 2, 35);
                }

                // Colisões e atualização de obstáculos
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].x -= gameSpeed;

                    // Caixa de colisão precisa
                    if (
                        cat.x < obstacles[i].x + obstacles[i].width - 8 &&
                        cat.x + cat.width - 8 > obstacles[i].x &&
                        cat.y < obstacles[i].y + obstacles[i].height &&
                        cat.y + cat.height > obstacles[i].y + 4
                    ) {
                        isGameOver = true;
                        if (score > highScore) {
                            highScore = Math.floor(score);
                        }
                    }

                    if (obstacles[i].x + obstacles[i].width < 0) {
                        obstacles.splice(i, 1);
                    }
                }
            }

            // Desenhar Obstáculos
            obstacles.forEach(obs => drawBathtub(obs));

            // Desenhar Gato
            drawCat();

            // Placar na Tela
            ctx.fillStyle = "#2c3e50";
            ctx.font = "bold 18px 'Courier New'";
            let scoreStr = Math.floor(score).toString().padStart(5, '0');
            let highScoreStr = highScore.toString().padStart(5, '0');
            ctx.fillText(`HI: ${highScoreStr}  SC: ${scoreStr}`, internalWidth - 260, 35);

            // Telas de Menu e Game Over
            if (!gameStarted) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.fillRect(0, 0, internalWidth, internalHeight);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 22px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("PRESSIONE ESPAÇO OU TOQUE PARA JOGAR", internalWidth / 2, internalHeight / 2);
                ctx.textAlign = "left";
            } else if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, internalWidth, internalHeight);
                ctx.fillStyle = "#e74c3c";
                ctx.font = "bold 28px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", internalWidth / 2, internalHeight / 2 - 20);
                ctx.fillStyle = "#ffffff";
                ctx.font = "16px 'Courier New'";
                ctx.fillText("Pressione Espaço ou Toque para Reiniciar", internalWidth / 2, internalHeight / 2 + 20);
                ctx.textAlign = "left";
            }

            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
